blueprint:
  name: Button Light Schedule
  description: >
    Single press follows schedules.
    Double press overrides schedules.

  domain: automation

  input:
    button:
      name: Button Device
      selector:
        device: {}

    target_light:
      name: Light
      selector:
        entity:
          domain: light

trigger:

  - platform: device
    device_id: !input button
    domain: homekit_controller
    type: button1
    subtype: single_press
    id: "button_on"

  - platform: device
    device_id: !input button
    domain: homekit_controller
    type: button1
    subtype: double_press
    id: "force_normal"

  - platform: device
    device_id: !input button
    domain: homekit_controller
    type: button2
    subtype: single_press
    id: "button_off"

  - platform: device
    device_id: !input button
    domain: homekit_controller
    type: button2
    subtype: double_press
    id: "force_sleep"

action:

  - choose:

      # OFF
      - conditions:
          - condition: trigger
            id: button_off

        sequence:
          - service: light.turn_off
            target:
              entity_id: !input target_light

      # FORCE NORMAL
      - conditions:
          - condition: trigger
            id: force_normal

        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 100
              color_temp_kelvin: 3152

      # FORCE SLEEP
      - conditions:
          - condition: trigger
            id: force_sleep

        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 1
              rgb_color:
                - [255, 85, 0]

      # BUTTON 1 SINGLE → schedule
      - conditions:
          - condition: trigger
            id: button_on

        sequence:

          - choose:

              - conditions:
                  - condition: state
                    entity_id: schedule.lights_sleep_mode
                    state: "on"

                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: 1
                      rgb_color:
                        - [255, 85, 0]

              - conditions:
                  - condition: state
                    entity_id: schedule.lights_dim_mode
                    state: "on"

                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: 20
                      color_temp_kelvin: 3000

            default:
              - service: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  brightness_pct: 70
                  color_temp_kelvin: 3152

mode: single
