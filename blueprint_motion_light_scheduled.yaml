blueprint:
  name: Motion Light Schedule
  description: Motion controlled light with global schedules for normal, dim and sleep mode.
  domain: automation

  input:
    motion_sensor:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    target_light:
      name: Light
      selector:
        entity:
          domain: light

    off_delay:
      name: Turn off delay
      default: 60
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: seconds

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: "motion_on"

  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input off_delay
    id: "motion_off"

action:

  - choose:

      - conditions:
          - condition: trigger
            id: motion_off

        sequence:
          - service: light.turn_off
            target:
              entity_id: !input target_light

      - conditions:
          - condition: trigger
            id: motion_on

        sequence:

          - choose:

              # Sleep
              - conditions:
                  - condition: state
                    entity_id: schedule.lights_sleep_mode
                    state: "on"

                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: 1
                      rgb_color:
                        - [255, 85, 0]

              # Dim
              - conditions:
                  - condition: state
                    entity_id: schedule.lights_dim_mode
                    state: "on"

                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: 20
                      color_temp_kelvin: 2800

            default:

              # Normal
              - service: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  brightness_pct: 70
                  color_temp_kelvin: 3152

mode: restart
